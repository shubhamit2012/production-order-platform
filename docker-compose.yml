services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-production_order_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - production-order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    restart: on-failure
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    env_file:
      - ./inventory-service/.env
    ports:
      - "8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:5006:5006"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    restart: on-failure
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      INVENTORY_SERVICE_BASE_URL: "http://toxiproxy:8500"
    env_file:
      - ./order-service/.env
    ports:
      - "8080:8080"
      - "127.0.0.1:5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    container_name: m_toxiproxy
    ports:
      - "8474:8474" # Toxiproxy Management API (controlled via host machine curl)
      - "8500:8500" # The chaotic proxy bridge port

volumes:
  production-order-db-data:
