spring.application.name=order-service
spring.output.ansi.enabled=always
server.port=8080

# Database configuration: defaults to in-memory H2, overridden via environment variables (see .env)
spring.datasource.url=${DB_URL:jdbc:h2:mem:order-service-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Schema ownership: this service owns the 'order_service' schema, migrated by Flyway
spring.flyway.schemas=order_service
spring.flyway.default-schema=order_service
spring.jpa.properties.hibernate.default_schema=order_service

inventory.service.base-url=${INVENTORY_SERVICE_BASE_URL:http://localhost:8081}
inventory.service.reserve.endpoint=/inventory/reservations
