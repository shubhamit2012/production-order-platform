spring.application.name=inventory-service
server.port=8081

# Database configuration: defaults to in-memory H2, overridden via environment variables (see .env)
spring.datasource.url=${DB_URL:jdbc:h2:mem:inventory-service-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Schema ownership: this service owns the 'inventory_service' schema, migrated by Flyway
spring.flyway.schemas=inventory_service
spring.flyway.default-schema=inventory_service
spring.jpa.properties.hibernate.default_schema=inventory_service
