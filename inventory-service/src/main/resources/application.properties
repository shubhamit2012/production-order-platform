spring.application.name=inventory-service
spring.output.ansi.enabled=always
server.port=8081
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database configuration: defaults to in-memory H2, overridden via environment variables (see .env)
spring.datasource.url=${DB_URL:jdbc:h2:mem:inventory-service-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# Schema ownership: this service owns the 'inventory_service' schema, migrated by Flyway
spring.flyway.schemas=inventory_service
spring.flyway.default-schema=inventory_service
spring.jpa.properties.hibernate.default_schema=inventory_service

management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.server.port=${MANAGEMENT_SERVER_PORT:8082}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.chaosmonkey.access=${MANAGEMENT_ENDPOINT_CHAOSMONKEY_ACCESS:none}

chaos.monkey.enabled=${CHAOS_MONKEY_ENABLED:false}
chaos.monkey.watcher.service=${CHAOS_MONKEY_WATCHER_SERVICE:true}
chaos.monkey.watcher.controller=${CHAOS_MONKEY_WATCHER_CONTROLLER:false}
chaos.monkey.watcher.rest-controller=${CHAOS_MONKEY_WATCHER_REST_CONTROLLER:false}
chaos.monkey.watcher.repository=${CHAOS_MONKEY_WATCHER_REPOSITORY:false}
chaos.monkey.watcher.component=${CHAOS_MONKEY_WATCHER_COMPONENT:false}
chaos.monkey.assaults.level=${CHAOS_MONKEY_ASSAULTS_LEVEL:1}
chaos.monkey.assaults.latency-active=${CHAOS_MONKEY_ASSAULTS_LATENCY_ACTIVE:false}
chaos.monkey.assaults.latency-range-start=${CHAOS_MONKEY_ASSAULTS_LATENCY_RANGE_START:5000}
chaos.monkey.assaults.latency-range-end=${CHAOS_MONKEY_ASSAULTS_LATENCY_RANGE_END:5000}
chaos.monkey.assaults.exceptions-active=${CHAOS_MONKEY_ASSAULTS_EXCEPTIONS_ACTIVE:false}
chaos.monkey.assaults.kill-application-active=${CHAOS_MONKEY_ASSAULTS_KILL_APPLICATION_ACTIVE:false}
chaos.monkey.assaults.memory-active=${CHAOS_MONKEY_ASSAULTS_MEMORY_ACTIVE:false}
chaos.monkey.assaults.cpu-active=${CHAOS_MONKEY_ASSAULTS_CPU_ACTIVE:false}
